</style><script type="module" src="/assets/page.CnXyC36v.js"></script></head> <iframe id="embed" style="visibility: hidden;" class="astro-5wq3ak55"></iframe> <script id="stackblitz-project" type="application/json">{"title":"Radashi Playground","description":"Explore the functions of Radashi by running and editing their documentation examples.","template":"typescript","files":{"array/alphabetical.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const gods = [\n    {\n      name: 'Ra',\n      power: 100,\n    },\n    {\n      name: 'Zeus',\n      power: 98,\n    },\n    {\n      name: 'Loki',\n      power: 72,\n    },\n    {\n      name: 'Vishnu',\n      power: 100,\n    },\n  ]\n\n  const alphabeticalByName = _.alphabetical(gods, g => g.name) // => [Loki, Ra, Vishnu, Zeus]\n  const alphabeticalByNameDesc = _.alphabetical(gods, g => g.name, 'desc') // => [Zeus, Vishnu, Ra, Loki]\n}","array/boil.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const gods = [\n    {\n      name: 'Ra',\n      power: 100,\n    },\n    {\n      name: 'Zeus',\n      power: 98,\n    },\n    {\n      name: 'Loki',\n      power: 72,\n    },\n  ]\n\n  const boilByPower = _.boil(gods, (a, b) => (a.power > b.power ? a : b))\n  // => { name: 'Ra', power: 100 }\n}","array/cartesianProduct.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const colors = ['red', 'blue']\n  const numbers = [1, 2, 3]\n  const booleans = [true, false]\n\n  _.cartesianProduct(colors, numbers, booleans)\n  // => [\n  //   ['red', 1, true],\n  //   ['red', 1, false],\n  //   ['red', 2, true],\n  //   ['red', 2, false],\n  //   ['red', 3, true],\n  //   ['red', 3, false],\n  //   ['blue', 1, true],\n  //   ['blue', 1, false],\n  //   ['blue', 2, true],\n  //   ['blue', 2, false],\n  //   ['blue', 3, true],\n  //   ['blue', 3, false],\n  // ]\n}","array/castArray.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const numberToArray = _.castArray(1) // => [1]\n  const arrayToArray = _.castArray([1, 2, 3]) // => [1, 2, 3]\n  const stringToArray = _.castArray('hello') // => ['hello']\n\n  const nullToArray = _.castArray(null) // => [null]\n  const undefinedToArray = _.castArray(undefined) // => [undefined]\n}","array/castArrayIfExists.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const numberToArray = _.castArrayIfExists(1) // => [1]\n  const arrayToArray = _.castArrayIfExists([1, 2, 3]) // => [1, 2, 3]\n  const stringToArray = _.castArrayIfExists('hello') // => ['hello']\n\n  const nullToArray = _.castArrayIfExists(null) // => null\n  const undefinedToArray = _.castArrayIfExists(undefined) // => undefined\n}","array/cluster.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const gods = [\n    'Ra',\n    'Zeus',\n    'Loki',\n    'Vishnu',\n    'Icarus',\n    'Osiris',\n    'Thor',\n    'Apollo',\n    'Artemis',\n    'Athena',\n  ]\n\n  const clustered = _.cluster(gods, 3)\n  // => [\n  //   ['Ra', 'Zeus', 'Loki'],\n  //   ['Vishnu', 'Icarus', 'Osiris'],\n  //   ['Thor', 'Apollo', 'Artemis'],\n  //   ['Athena']\n  // ]\n}","array/concat.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const result = concat('a', null, ['b', undefined], 'c')\n  // => ['a', 'b', 'c']\n}","array/counting.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const gods = [\n    {\n      name: 'Ra',\n      culture: 'egypt',\n    },\n    {\n      name: 'Zeus',\n      culture: 'greek',\n    },\n    {\n      name: 'Loki',\n      culture: 'greek',\n    },\n  ]\n\n  const countingByCulture = _.counting(gods, g => g.culture) // => { egypt: 1, greek: 2 }\n}","array/diff.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const oldWorldGods = ['ra', 'zeus']\n  const newWorldGods = ['vishnu', 'zeus']\n\n  const diff = _.diff(oldWorldGods, newWorldGods) // => ['ra']\n}","array/first.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const gods = ['ra', 'loki', 'zeus']\n\n  const first = _.first(gods) // => 'ra'\n  const firstDefault = _.first([], 'vishnu') // => 'vishnu'\n}","array/flat.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const gods = [['ra', 'loki'], ['zeus']]\n\n  const flat = _.flat(gods) // => [ra, loki, zeus]\n}","array/fork.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const gods = [\n    {\n      name: 'Ra',\n      power: 100,\n    },\n    {\n      name: 'Zeus',\n      power: 98,\n    },\n    {\n      name: 'Loki',\n      power: 72,\n    },\n    {\n      name: 'Vishnu',\n      power: 100,\n    },\n  ]\n\n  const [finalGods, lesserGods] = _.fork(gods, f => f.power > 90) // [[ra, vishnu, zeus], [loki]]\n}","array/group.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const fish = [\n    {\n      name: 'Marlin',\n      source: 'ocean',\n    },\n    {\n      name: 'Bass',\n      source: 'lake',\n    },\n    {\n      name: 'Trout',\n      source: 'lake',\n    },\n  ]\n\n  const fishBySource = _.group(fish, f => f.source) // => { ocean: [marlin], lake: [bass, trout] }\n}","array/intersects.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const oceanFish = ['tuna', 'tarpon']\n  const lakeFish = ['bass', 'trout']\n\n  _.intersects(oceanFish, lakeFish) // => false\n\n  const brackishFish = ['tarpon', 'snook']\n\n  _.intersects(oceanFish, brackishFish) // => true\n}","array/isArrayEqual.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  _.isArrayEqual([1, 2, 3], [1, 2, 3])\n  // => true\n\n  _.isArrayEqual([1, 2, 3], [1, 2, 4])\n  // => false\n\n  _.isArrayEqual([1, 2], [1, 2, 3])\n  // => false\n\n  _.isArrayEqual([], [])\n  // => true\n\n  _.isArrayEqual([NaN], [NaN])\n  // => true (Object.is handles NaN)\n\n  _.isArrayEqual([0], [-0])\n  // => false (Object.is handles +0 and -0)\n}","array/iterate.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const value = _.iterate(\n    4,\n    (acc, idx) => {\n      return acc + idx\n    },\n    0,\n  ) // => 10\n}","array/last.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const fish = ['marlin', 'bass', 'trout']\n\n  const lastFish = _.last(fish) // => 'trout'\n  const lastItem = _.last([], 'bass') // => 'bass'\n}","array/list.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  _.list(3) // [0, 1, 2, 3]\n  _.list(1, 3) // [1, 2, 3]\n  _.list(0, 3, 'y') // [y, y, y, y]\n  _.list(0, 3, () => 'y') // [y, y, y, y]\n  _.list(0, 3, i => i) // [0, 1, 2, 3]\n  _.list(0, 3, i => `y${i}`) // [y0, y1, y2, y3]\n  _.list(0, 3, {}) // [{}, {}, {}, {}]\n  _.list(0, 6, i => i, 2) // [0, 2, 4, 6]\n}","array/mapify.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const fish = [\n    {\n      name: 'Marlin',\n      weight: 105,\n    },\n    {\n      name: 'Bass',\n      weight: 8,\n    },\n    {\n      name: 'Trout',\n      weight: 13,\n    },\n  ] as const\n\n  const mappedByName = _.mapify(fish, f => f.name) // => Map(3) {'Marlin' => { name: 'Marlin', weight: 105 }, 'Bass' => { name: 'Bass', weight: 8 }, 'Trout' => { name: 'Trout', weight: 13 }}\n  const mappedByNameAndWeight = _.mapify(\n    fish,\n    f => f.name,\n    f => f.weight,\n  ) // => Map(3) { 'Marlin' => 105, 'Bass' => 8, 'Trout' => 13 }\n}","array/merge.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const gods = [\n    {\n      name: 'Zeus',\n      power: 92,\n    },\n    {\n      name: 'Ra',\n      power: 97,\n    },\n  ]\n\n  const newGods = [\n    {\n      name: 'Zeus',\n      power: 100,\n    },\n  ]\n\n  const mergedGods = _.merge(gods, newGods, f => f.name) // => [{name: \"Zeus\" power: 100}, {name: \"Ra\", power: 97}]\n}","array/objectify.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const fish = [\n    {\n      name: 'Marlin',\n      weight: 105,\n    },\n    {\n      name: 'Bass',\n      weight: 8,\n    },\n    {\n      name: 'Trout',\n      weight: 13,\n    },\n  ] as const\n\n  const objectifiedByName = _.objectify(fish, f => f.name) // => { Marlin: [marlin object], Bass: [bass object], ... }\n  const objectifiedByNameAndWeight = _.objectify(\n    fish,\n    f => f.name,\n    f => f.weight,\n  ) // => { Marlin: 105, Bass: 8, Trout: 13 }\n}","array/pluck.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const gods = [\n    { name: 'Ra', power: 100, domain: 'Sun' },\n    { name: 'Zeus', power: 98, domain: 'Lightning' },\n    { name: 'Loki', power: 72, domain: 'Tricks' },\n  ]\n\n  // Extract single property\n  const names = _.pluck(gods, ['name'])\n  // => [['Ra'], ['Zeus'], ['Loki']]\n\n  // Extract multiple properties\n  const powerDomains = _.pluck(gods, ['power', 'domain'])\n  // => [[100, 'Sun'], [98, 'Lightning'], [72, 'Tricks']]\n\n  // Extract all properties\n  const allProps = _.pluck(gods)\n  // => [['Ra', 100, 'Sun'], ['Zeus', 98, 'Lightning'], ['Loki', 72, 'Tricks']]\n}","array/remove.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const numbers = [1, 2, 3, 4, 5]\n  const oddNumbers = _.remove(numbers, value => value % 2 === 0)\n  console.log(oddNumbers) // => [1, 3, 5]\n\n  const objects = [\n    { id: 1, active: true },\n    { id: 2, active: false },\n    { id: 3, active: true },\n  ]\n  const inactiveObjects = _.remove(objects, obj => obj.active)\n  console.log(inactiveObjects) // => [{ id: 2, active: false }]\n}","array/replace.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const fish = [\n    {\n      name: 'Marlin',\n      weight: 105,\n    },\n    {\n      name: 'Bass',\n      weight: 8,\n    },\n    {\n      name: 'Trout',\n      weight: 13,\n    },\n  ]\n\n  const salmon = {\n    name: 'Salmon',\n    weight: 22,\n  }\n\n  // read: replace fish with salmon where the name is Bass\n  const replaced = _.replace(fish, salmon, f => f.name === 'Bass') // => [marlin, salmon, trout]\n}","array/replaceOrAppend.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const fish = [\n    {\n      name: 'Marlin',\n      weight: 105,\n    },\n    {\n      name: 'Salmon',\n      weight: 19,\n    },\n    {\n      name: 'Trout',\n      weight: 13,\n    },\n  ]\n\n  const salmon = {\n    name: 'Salmon',\n    weight: 22,\n  }\n\n  const sockeye = {\n    name: 'Sockeye',\n    weight: 8,\n  }\n\n  _.replaceOrAppend(fish, salmon, f => f.name === 'Salmon') // => [marlin, salmon (weight:22), trout]\n  _.replaceOrAppend(fish, sockeye, f => f.name === 'Sockeye') // => [marlin, salmon, trout, sockeye]\n}","array/select.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const fish = [\n    {\n      name: 'Marlin',\n      weight: 105,\n      source: 'ocean',\n    },\n    {\n      name: 'Bass',\n      weight: 8,\n      source: 'lake',\n    },\n    {\n      name: 'Trout',\n      weight: 13,\n      source: 'lake',\n    },\n  ]\n\n  _.select(\n    fish,\n    f => f.weight,\n    f => f.source === 'lake',\n  ) // => [8, 13]\n}","array/selectFirst.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  // Find the first even number and double it\n  _.selectFirst(\n    [1, 3, 4, 6, 8],\n    x => x * 2,\n    x => x % 2 === 0,\n  )\n  // => 8\n\n  // Find the first non-empty string and convert to uppercase\n  _.selectFirst(\n    ['', null, 'hello', 'world'],\n    s => s?.toUpperCase(),\n    s => s !== null && s !== '',\n  )\n  // => 'HELLO'\n\n  // Find the first object with a specific property and extract a value\n  const users = [\n    { id: 1, name: 'Alice', age: 30 },\n    { id: 2, name: 'Bob', age: 25 },\n    { id: 3, name: 'Charlie', age: 35 },\n  ]\n  _.selectFirst(\n    users,\n    user => user.name,\n    user => user.age > 30,\n  )\n  // => 'Charlie'\n\n  // Using default condition (non-nullish)\n  _.selectFirst([null, undefined, 0, '', false, 'found'], x => x)\n  // => 0\n}","array/shift.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const arr = [1, 2, 3, 4, 5, 6, 7, 8, 9]\n  _.shift(arr, 3) // => [7, 8, 9, 1, 2, 3, 4, 5, 6]\n}","array/sift.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const fish = ['salmon', null, false, NaN, 'sockeye', 'bass']\n\n  _.sift(fish) // => ['salmon', 'sockeye', 'bass']\n}","array/sort.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const fish = [\n    {\n      name: 'Marlin',\n      weight: 105,\n    },\n    {\n      name: 'Bass',\n      weight: 8,\n    },\n    {\n      name: 'Trout',\n      weight: 13,\n    },\n  ]\n\n  _.sort(fish, f => f.weight) // => [bass, trout, marlin]\n  _.sort(fish, f => f.weight, true) // => [marlin, trout, bass]\n\n  const numbers = [2, 0, 1]\n\n  _.sort(numbers) // => [0, 1, 2]\n  _.sort(numbers, _.identity, true) // => [2, 1, 0]\n}","array/toggle.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const gods = ['ra', 'zeus', 'loki']\n\n  _.toggle(gods, 'ra') // => ['zeus', 'loki']\n  _.toggle(gods, 'vishnu') // => ['ra', 'zeus', 'loki', 'vishnu']\n}","array/unique.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const fish = [\n    {\n      name: 'Marlin',\n      weight: 105,\n      source: 'ocean',\n    },\n    {\n      name: 'Salmon',\n      weight: 22,\n      source: 'river',\n    },\n    {\n      name: 'Salmon',\n      weight: 23,\n      source: 'stream',\n    },\n  ]\n\n  _.unique(fish, f => f.name)\n  // [\n  //     { name: 'Marlin', weight: 105, source: 'ocean' },\n  //     { name: 'Salmon', weight: 22, source: 'river' }\n  // ]\n}","array/unzip.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  _.unzip([\n    ['a', 1, true],\n    ['b', 2, false],\n  ])\n  // => [\n  //   ['a', 'b'],\n  //   [1, 2],\n  //   [true, false],\n  // ]\n}","array/zip.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const names = ['ra', 'zeus', 'loki']\n  const cultures = ['egypt', 'greek', 'norse']\n\n  _.zip(names, cultures)\n  // => [\n  //   [ra, egypt]\n  //   [zeus, greek]\n  //   [loki, norse]\n  // ]\n}","array/zipToObject.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const names = ['ra', 'zeus', 'loki']\n  const cultures = ['egypt', 'greek', 'norse']\n\n  _.zipToObject(names, cultures)\n  // => { ra: egypt, zeus: greek, loki: norse }\n\n  _.zipToObject(names, (k, i) => k + i)\n  // => { ra: ra0, zeus: zeus1, loki: loki2 }\n\n  _.zipToObject(names, null)\n  // => { ra: null, zeus: null, loki: null }\n}","async/defer.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  import fs from 'fs/promises'\n\n  // Placeholder functions\n  const createBuildDir = async () => {\n    console.log('Creating build directory...')\n    await _.sleep(100)\n    console.log('Build directory created.')\n    return 'build'\n  }\n  const build = async () => {\n    console.log('Building project...')\n    await _.sleep(100)\n    console.log('Project built.')\n  }\n\n  await _.defer(async cleanup => {\n    const buildDir = await createBuildDir()\n\n    cleanup(() => fs.unlink(buildDir))\n\n    await build()\n  })\n}","async/guard.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const example = async () => {\n    throw new Error()\n  }\n\n  const result = (await _.guard(example)) ?? []\n  // []\n}","async/map.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const userIds = [1, 2, 3, 4]\n  const api = {\n    users: {\n      find: async (id: number) => id < 3,\n    },\n  }\n\n  const users = await _.map(userIds, async userId => {\n    return await api.users.find(userId)\n  }) // [true, true, false, false]\n}","async/parallel.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  // @noErrors\n\n  const abortController = new AbortController()\n  const signal = abortController.signal\n\n  // Pass in the signal:\n  const pizzas = await _.parallel(\n    { limit: 2, signal },\n    ['pepperoni', 'cheese', 'mushroom'],\n    async topping => {\n      return await bakePizzaInWoodFiredOven(topping) // each pizza takes 10 minutes!\n    },\n  )\n\n  // Later on, if you need to abort:\n  abortController.abort()\n}","async/queueByKey.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const updateUser = async (userId: string, data: object) => {\n    // Simulate API call that shouldn't overlap for the same user\n    const response = await fetch(`/api/users/${userId}`, {\n      method: 'POST',\n      body: JSON.stringify(data),\n    })\n    return response.json()\n  }\n\n  const queuedUpdate = _.queueByKey(updateUser, userId => userId)\n\n  // These will run sequentially for user123\n  queuedUpdate('user123', { name: 'Alice' })\n  queuedUpdate('user123', { age: 30 })\n\n  // This runs in parallel with user123's queue\n  queuedUpdate('user456', { name: 'Bob' })\n}","async/reduce.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const userIds = [1, 2, 3, 4]\n  const api = {\n    users: {\n      async find(id: number) {\n        return { name: `person ${id}` }\n      },\n    },\n  }\n\n  const users = await _.reduce(\n    userIds,\n    async (acc, userId) => {\n      const user = await api.users.find(userId)\n      return {\n        ...acc,\n        [userId]: user,\n      }\n    },\n    {},\n  ) // { 1: { name: 'person 1' }, 2: { name: 'person 2' }, 3: { name: 'person 3' }, 4: { name: 'person 4' } }\n}","async/retry.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const api = {\n    users: {\n      async list() {\n        if (Math.random() < 0.5) {\n          throw new Error('Random error')\n        }\n        return []\n      },\n    },\n  }\n\n  await _.retry({}, api.users.list) // try 3 times before failing\n  await _.retry({ times: 10 }, api.users.list) // try 10 times before failing\n  await _.retry({ times: 2, delay: 1000 }, api.users.list) // try 2 times with 1 second delay\n\n  // exponential backoff\n  await _.retry({ backoff: i => 10 ** i }, api.users.list) // try 3 times with 10, 100, 1000 ms delay\n}","async/sleep.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  await _.sleep(2000) // => waits 2 seconds\n}","async/timeout.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  // Rejects after 1 second with a default TimeoutError\n  await _.timeout(1000)\n\n  // Rejects after 1 second with a custom TimeoutError message\n  await _.timeout(1000, 'Custom timeout message')\n\n  // Rejects after 1 second with a custom error type\n  await _.timeout(1000, () => new Error('Custom error'))\n}","async/toResult.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const good = async (): Promise<number> => 1\n  const bad = async (): Promise<number> => {\n    throw new Error('bad')\n  }\n\n  const goodResult = await toResult(good())\n  // => [undefined, 1]\n\n  const badResult = await toResult(bad())\n  // => [Error('bad'), undefined]\n}","async/withResolvers.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const { resolve, reject, promise } = _.withResolvers()\n\n  resolve(42)\n}","curry/chain.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const add = (y: number) => (x: number) => x + y\n  const multiply = (y: number) => (x: number) => x * y\n  const addFive = add(5)\n  const double = multiply(2)\n\n  const chained = _.chain(addFive, double)\n\n  chained(0) // => 10\n  chained(7) // => 24\n}","curry/compose.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const useZero = (fn: any) => () => fn(0)\n  const objectize = (fn: any) => (num: any) => fn({ num })\n  const increment =\n    (fn: any) =>\n    ({ num }: any) =>\n      fn({ num: num + 1 })\n  const returnArg = (arg: any) => (args: any) => args[arg]\n\n  const composed = _.compose(\n    useZero,\n    objectize,\n    increment,\n    increment,\n    returnArg('num'),\n  )\n\n  composed() // => 2\n}","curry/debounce.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const processData = (data: string) => {\n    console.log(`Processing data: \"${data}\"...`)\n  }\n  const debouncedProcessData = _.debounce({ delay: 100 }, processData)\n\n  debouncedProcessData('data1') // Never logs\n  debouncedProcessData('data2') // Never logs\n  debouncedProcessData('data3') // Processing data: \"data3\"...\n\n  setTimeout(() => {\n    debouncedProcessData('data4') // Processing data: \"data4\"... (200ms later)\n  }, 200)\n}","curry/flip.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const subtract = (a: number, b: number) => a - b\n\n  subtract(1, 2) // => -1\n  _.flip(subtract)(1, 2) // => 1\n}","curry/memo.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const timestamp = _.memo(() => Date.now())\n\n  const now = timestamp()\n  const later = timestamp()\n\n  now === later // => true\n}","curry/memoLastCall.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const expensiveCalculation = (x: number, y: number): number => {\n    console.log('Calculating...')\n    return x + y\n  }\n\n  const memoizedCalc = _.memoLastCall(expensiveCalculation)\n\n  memoizedCalc(2, 3) // Logs 'Calculating...'\n  memoizedCalc(2, 3) // Returns cached result\n  memoizedCalc(3, 4) // Logs 'Calculating...'\n  memoizedCalc(2, 3) // Logs 'Calculating...'\n}","curry/once.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const fn = _.once(() => Math.random())\n  fn() // 0.5\n  fn() // 0.5\n}","curry/partial.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const add = (a: number, b: number) => a + b\n\n  const addFive = _.partial(add, 5)\n\n  addFive(2) // => 7\n}","curry/partob.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const add = (props: { a: number; b: number }) => props.a + props.b\n\n  const addFive = _.partob(add, { a: 5 })\n\n  addFive({ b: 2 }) // => 7\n}","curry/promiseChain.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const func1 = (a: number, b: number) => a + b\n  const func2 = async (n: number) => n * 2\n  const func3 = async (n: number) => `Your Value is ${n}`\n\n  const chained = _.promiseChain(func1, func2, func3)\n\n  await chained(5, 2) // => \"Your Value is 14\"\n}","curry/throttle.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  // @noErrors\n\n  // Throttle a scroll event handler\n  const handleScroll = () => {\n    console.log('Scroll position:', window.scrollY)\n  }\n  const throttledScroll = _.throttle({ interval: 200 }, handleScroll)\n  window.addEventListener('scroll', throttledScroll)\n\n  // Throttle an API call\n  const throttledFetch = _.throttle(\n    { interval: 5000, trailing: true },\n    async () => {\n      const response = await fetch('https://api.example.com/data')\n      const data = await response.json()\n      console.log(data)\n    },\n  )\n\n  // Check if throttled\n  console.log('Is throttled:', throttledFetch.isThrottled())\n}","function/always.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  // @noErrors\n\n  const alwaysTrue = _.always(true)\n\n  alwaysTrue() // true\n  alwaysTrue(1, 2, 3) // true\n}","function/castComparator.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  // @noErrors\n\n  const users = [\n    { id: 1, firstName: 'Alice', lastName: 'Smith' },\n    { id: 3, firstName: 'Charlie', lastName: 'Brown' },\n    { id: 2, firstName: 'Drew', lastName: 'Johnson' },\n  ]\n\n  const compareById = _.castComparator('id')\n  users.sort(compareById)\n  // [Alice, Drew, Charlie]\n\n  const compareByFullName = _.castComparator(\n    (user: (typeof users)[number]) => `${user.firstName} ${user.lastName}`,\n    (a, b) => b.localeCompare(a),\n  )\n  users.sort(compareByFullName)\n  // [Alice, Charlie, Drew]\n}","function/castMapping.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  // Using a property name\n  const getName = _.castMapping('name')\n  getName({ name: 'Alice' }) // => 'Alice'\n\n  // Using a function\n  const getLength = _.castMapping((str: string) => str.length)\n  getLength('Hello') // => 5\n\n  // Using undefined\n  const identity = _.castMapping(undefined)\n  identity({ any: 'value' }) // => { any: 'value' }\n}","function/identity.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  _.identity() // => undefined\n  _.identity(1) // => 1\n  _.identity('a') // => 'a'\n}","function/noop.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  _.noop() // => undefined\n}","number/clamp.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const inRange = _.clamp(5, 1, 10) // 5\n  const smaller = _.clamp(0, 1, 10) // 1\n  const bigger = _.clamp(15, 1, 10) // 10\n}","number/inRange.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  _.inRange(10, 0, 20) // true\n  _.inRange(9.99, 0, 10) // true\n  _.inRange(Math.PI, 0, 3.15) // true\n  _.inRange(10, 10, 20) // true\n  _.inRange(10, 0, 10) // false\n\n  _.inRange(1, 2) // true\n  _.inRange(1, 0) // false\n}","number/lerp.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  _.lerp(0, 10, 0.5) // => 5\n  _.lerp(5, 15, 0.2) // => 7\n  _.lerp(-10, 10, 0.75) // => 5\n}","number/max.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const fish = [\n    {\n      name: 'Marlin',\n      weight: 105,\n      source: 'ocean',\n    },\n    {\n      name: 'Bass',\n      weight: 8,\n      source: 'lake',\n    },\n    {\n      name: 'Trout',\n      weight: 13,\n      source: 'lake',\n    },\n  ]\n\n  _.max(fish, f => f.weight) // => {name: \"Marlin\", weight: 105, source: \"ocean\"}\n}","number/min.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const fish = [\n    {\n      name: 'Marlin',\n      weight: 105,\n      source: 'ocean',\n    },\n    {\n      name: 'Bass',\n      weight: 8,\n      source: 'lake',\n    },\n    {\n      name: 'Trout',\n      weight: 13,\n      source: 'lake',\n    },\n  ]\n\n  _.min(fish, f => f.weight) // => {name: \"Bass\", weight: 8, source: \"lake\"}\n}","number/parseDuration.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  _.parseDuration('1 second') // => 1_000\n  _.parseDuration('1h') // => 3_600_000\n  _.parseDuration('1 hour') // => 3_600_000\n  _.parseDuration('1.5 hours') // => 5_400_000\n  _.parseDuration('-1h') // => -3_600_000\n}","number/parseQuantity.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const moneyUnits: _.QuantityParser.Options<'cent' | 'dollar', '$'> = {\n    units: {\n      cent: 1,\n      dollar: 100,\n    },\n    short: {\n      $: 'dollar',\n    },\n  } as const\n\n  _.parseQuantity('1 cent', moneyUnits)\n  // => 1\n\n  _.parseQuantity('2 dollars', moneyUnits)\n  // => 200\n\n  _.parseQuantity('5$', moneyUnits)\n  // => 500\n}","number/range.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  _.range(3) // yields 0, 1, 2, 3\n  _.range(0, 3) // yields 0, 1, 2, 3\n  _.range(0, 3, 'y') // yields y, y, y, y\n  _.range(0, 3, () => 'y') // yields y, y, y, y\n  _.range(0, 3, i => i) // yields 0, 1, 2, 3\n  _.range(0, 3, i => `y${i}`) // yields y0, y1, y2, y3\n  _.range(0, 3, obj) // yields obj, obj, obj, obj\n  _.range(0, 6, i => i, 2) // yields 0, 2, 4, 6\n\n  for (const i of _.range(0, 200, 10)) {\n    console.log(i) // => 0, 10, 20, 30 ... 190, 200\n  }\n\n  for (const i of _.range(0, 5)) {\n    console.log(i) // => 0, 1, 2, 3, 4, 5\n  }\n}","number/round.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  _.round(123.456) // => 123\n  _.round(1234.56, -2) // => 1200\n}","number/sum.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const fish = [\n    {\n      name: 'Marlin',\n      weight: 100,\n    },\n    {\n      name: 'Bass',\n      weight: 10,\n    },\n    {\n      name: 'Trout',\n      weight: 15,\n    },\n  ]\n\n  _.sum(fish, f => f.weight) // => 125\n}","number/toFloat.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  _.toFloat(0) // => 0.0\n  _.toFloat(null) // => 0.0\n  _.toFloat(null, 3.33) // => 3.33\n}","number/toInt.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  _.toInt(0) // => 0\n  _.toInt(null) // => 0\n  _.toInt(null, 3) // => 3\n}","object/assign.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  // @errors: 2345\n\n  const ra = {\n    name: 'Ra',\n    power: 100,\n  }\n\n  const merged = _.assign(ra, { name: 'Loki' })\n  // => { name: Loki, power: 100 }\n}","object/clone.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const ra = {\n    name: 'Ra',\n    power: 100,\n  }\n\n  const gods = [ra]\n\n  _.clone(ra) // => copy of ra\n  _.clone(gods) // => copy of gods\n}","object/cloneDeep.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const obj = { a: 1, b: { c: 2 } }\n  const clone = _.cloneDeep(obj)\n  // => { a: 1, b: { c: 2 } }\n\n  console.log('clone !== obj', clone !== obj)\n  console.log('clone.b !== obj.b', clone.b !== obj.b)\n}","object/construct.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const flat = {\n    name: 'ra',\n    power: 100,\n    'friend.name': 'loki',\n    'friend.power': 80,\n    'enemies.0.name': 'hathor',\n    'enemies.0.power': 12,\n  }\n\n  const reconstructed = _.construct(flat)\n  // {\n  //   name: 'ra',\n  //   power: 100,\n  //   friend: {\n  //     name: 'loki',\n  //     power: 80\n  //   },\n  //   enemies: [\n  //     {\n  //       name: 'hathor',\n  //       power: 12\n  //     }\n  //   ]\n  // }\n}","object/crush.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const ra = {\n    name: 'ra',\n    power: 100,\n    friend: {\n      name: 'loki',\n      power: 80,\n    },\n    enemies: [\n      {\n        name: 'hathor',\n        power: 12,\n      },\n    ],\n  }\n\n  const crushed = _.crush(ra)\n  // {\n  //   name: 'ra',\n  //   power: 100,\n  //   'friend.name': 'loki',\n  //   'friend.power': 80,\n  //   'enemies.0.name': 'hathor',\n  //   'enemies.0.power': 12\n  // }\n}","object/filterKey.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  function filterObject(obj: object, filter: _.KeyFilter) {\n    for (const key in obj) {\n      if (_.filterKey(obj, key, filter)) {\n        // ...\n      }\n    }\n  }\n}","object/get.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const fish = {\n    name: 'Bass',\n    weight: 8,\n    sizes: [\n      {\n        maturity: 'adult',\n        range: [7, 18],\n        unit: 'inches',\n      },\n    ],\n  }\n\n  _.get(fish, 'sizes[0].range[1]') // 18\n  _.get(fish, 'sizes.0.range.1') // 18\n  _.get(fish, 'foo', 'default') // 'default'\n}","object/getOrInsert.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const counts = new Map<string, number>()\n\n  _.getOrInsert(counts, 'clicks', 1) // => 1\n  _.getOrInsert(counts, 'clicks', 5) // => 1\n}","object/getOrInsertComputed.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const counts = new Map<string, number>()\n\n  _.getOrInsertComputed(counts, 'clicks', () => 1) // => 1\n  _.getOrInsertComputed(counts, 'clicks', () => 5) // => 1\n}","object/invert.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const powersByGod = {\n    ra: 'sun',\n    loki: 'tricks',\n    zeus: 'lightning',\n  }\n\n  _.invert(powersByGod) // => { sun: ra, tricks: loki, lightning: zeus }\n}","object/keys.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const ra = {\n    name: 'ra',\n    power: 100,\n    friend: {\n      name: 'loki',\n      power: 80,\n    },\n    enemies: [\n      {\n        name: 'hathor',\n        power: 12,\n      },\n    ],\n  }\n\n  _.keys(ra)\n  // => [\n  //   'name',\n  //   'power',\n  //   'friend.name',\n  //   'friend.power',\n  //   'enemies.0.name',\n  //   'enemies.0.power'\n  // ]\n}","object/listify.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const fish = {\n    marlin: {\n      weight: 105,\n    },\n    bass: {\n      weight: 8,\n    },\n  }\n\n  _.listify(fish, (key, value) => ({ ...value, name: key })) // => [{ name: 'marlin', weight: 105 }, { name: 'bass', weight: 8 }]\n}","object/lowerize.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const ra = {\n    Mode: 'god',\n    Power: 'sun',\n  }\n\n  _.lowerize(ra) // => { mode, power }\n}","object/mapEntries.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const ra = {\n    name: 'Ra',\n    power: 'sun',\n    rank: 100,\n    culture: 'egypt',\n  }\n\n  _.mapEntries(ra, (key, value) => [key.toUpperCase(), `${value}`]) // => { NAME: 'Ra', POWER: 'sun', RANK: '100', CULTURE: 'egypt' }\n}","object/mapKeys.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const ra = {\n    mode: 'god',\n    power: 'sun',\n  }\n\n  _.mapKeys(ra, key => key.toUpperCase()) // => { MODE, POWER }\n  _.mapKeys(ra, (key, value) => value) // => { god: 'god', power: 'power' }\n}","object/mapValues.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const ra = {\n    mode: 'god',\n    power: 'sun',\n  }\n\n  _.mapValues(ra, value => value.toUpperCase()) // => { mode: 'GOD', power: 'SUN' }\n  _.mapValues(ra, (value, key) => key) // => { mode: 'mode', power: 'power' }\n}","object/mergeOptions.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const defaults = { port: 3000, host: 'localhost' }\n  const userConfig = { port: 8080, ssl: true }\n\n  _.mergeOptions(defaults, userConfig)\n  // => { port: 8080, host: 'localhost', ssl: true }\n}","object/omit.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const fish = {\n    name: 'Bass',\n    weight: 8,\n    source: 'lake',\n    brackish: false,\n  }\n\n  _.omit(fish, ['name', 'source']) // => { weight, brackish }\n}","object/pick.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const fish = {\n    name: 'Bass',\n    weight: 8,\n    source: 'lake',\n    brackish: false,\n  }\n\n  _.pick(fish, ['name', 'source']) // => { name, source }\n}","object/set.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  _.set({}, 'name', 'ra')\n  // => { name: 'ra' }\n\n  _.set({}, 'cards[0].value', 2)\n  // => { cards: [{ value: 2 }] }\n}","object/shake.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const options = _.shake({\n    mode: 'party',\n    volume: undefined,\n    dancing: false,\n    snacks: null,\n  })\n  // => { mode: 'party', dancing: false, snacks: null }\n}","object/traverse.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  // @noErrors\n\n  const root = { a: { b: 2 }, c: [1, 2] }\n\n  _.traverse(root, (value, key, parent, context) => {\n    const depth = context.parents.length\n    console.log(' '.repeat(depth * 2), key, '=>', value)\n  })\n  // Logs the following:\n  //   a => { b: 2 }\n  //     b => 2\n  //   c => [1, 2]\n  //     0 => 1\n  //     1 => 2\n}","object/upperize.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const ra = {\n    Mode: 'god',\n    Power: 'sun',\n  }\n\n  _.upperize(ra) // => { MODE, POWER }\n}","oop/Semaphore.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const semaphore = new Semaphore(2)\n\n  const permit = await semaphore.acquire()\n\n  permit.release()\n}","random/absoluteJitter.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const base = 50\n  _.absoluteJitter(base, 5) // => a number between 45 and 55\n}","random/draw.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const fish = ['marlin', 'bass', 'trout']\n\n  _.draw(fish) // => a random fish\n}","random/proportionalJitter.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const base = 100\n  _.proportionalJitter(base, 0.1) // => a number between 90 and 110\n}","random/random.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  _.random(0, 100) // => a random number between 0 and 100\n}","random/shuffle.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const fish = [\n    {\n      name: 'Marlin',\n      weight: 105,\n      source: 'ocean',\n    },\n    {\n      name: 'Salmon',\n      weight: 22,\n      source: 'river',\n    },\n    {\n      name: 'Salmon',\n      weight: 22,\n      source: 'river',\n    },\n  ]\n\n  _.shuffle(fish)\n}","random/uid.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  _.uid(7) // => UaOKdlW\n  _.uid(12, '*') // => egFn*THGelM8\n}","series/series.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  type Weekday = 'monday' | 'tuesday' | 'wednesday' | 'thursday' | 'friday'\n\n  const weekdays = _.series<Weekday>([\n    'monday',\n    'tuesday',\n    'wednesday',\n    'thursday',\n    'friday',\n  ])\n\n  const a = weekdays.min('tuesday', 'thursday') // => 'tuesday'\n  const b = weekdays.max('wednesday', 'monday') // => 'wednesday'\n  const c = weekdays.next('wednesday') // => 'thursday'\n  const d = weekdays.previous('tuesday') // => 'monday'\n  const e = weekdays.first() // => 'monday'\n  const f = weekdays.last() // => 'friday'\n  const g = weekdays.next('friday') // => null\n  const h = weekdays.next('friday', weekdays.first()) // => 'monday'\n  const i = weekdays.spin('monday', 3) // => 'thursday'\n}","string/camel.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  const camelText = _.camel('green fish blue fish') // => greenFishBlueFish\n}","string/capitalize.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  _.capitalize('green fish blue FISH') // => Green fish blue fish\n}","string/dash.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  _.dash( > false\n}","typed/isBoolean.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  _.isBoolean(true) // => true\n  _.isBoolean(false) // => true\n  _.isBoolean('true') // => false\n  _.isBoolean(1) // => false\n  _.isBoolean(new Boolean(true)) // => false\n  _.isBoolean(undefined) // => false\n  _.isBoolean(null) // => false\n}","typed/isClass.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  // @noErrors\n\n  class MyClass {}\n\n  function OldSchoolClass() {\n    this.foo = 'bar'\n  }\n\n  _.isClass(MyClass) // => true\n  _.isClass(Error) // => false\n  _.isClass(OldSchoolClass) // => false\n  _.isClass('abc') // => false\n  _.isClass({}) // => false\n  _.isClass(undefined) // => false\n}","typed/isDate.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  _.isDate(new Date()) // => true\n  _.isDate(12) // => false\n  _.isDate('hello') // => false\n}","typed/isEmpty.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  _.isEmpty([]) // => true\n  _.isEmpty('') // => true\n\n  _.isEmpty('hello') // => false\n  _.isEmpty(['hello']) // => false\n}","typed/isEqual.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  // @errors: 2345\n\n  _.isEqual(null, null) // => true\n  _.isEqual([], []) // => true\n  _.isEqual({ hello: 'world' }, { hello: 'world' }) // => true\n\n  _.isEqual('hello', 'world') // => false\n  _.isEqual(22, 'abc') // => false\n}","typed/isError.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  _.isError(new Error()) // => true\n  _.isError(new TypeError()) // => true\n  _.isError('An error occurred') // => false\n  _.isError({ message: 'Error' }) // => false\n}","typed/isFloat.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  _.isFloat(12.233) // => true\n  _.isFloat(12) // => false\n  _.isFloat('hello') // => false\n}","typed/isFunction.ts":"import * as _ from 'radashi'\n\nexport async function run() {\n  _.isFunction('hello')
